<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도트 시트 미리보기</title>
<style>
  :root { --bg: #f4ead3; --ink: #2b1d12; --card: #fffaf0; --line: #8a6a48; --ok: #2f7a4a; --warn: #b4441c; --grass: #8fc46f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.lead { margin: 0 0 16px; }
  #drop { border: 3px dashed var(--line); border-radius: 14px; background: var(--card); padding: 22px 16px; text-align: center; cursor: pointer; }
  #drop.over { background: #fff1c9; }
  #drop b { display: block; font-size: 17px; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 12px; }
  .walk { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; flex: 1 1 520px; }
  .walk figure { margin: 0; text-align: center; }
  .walk canvas { width: 100%; max-width: 128px; aspect-ratio: 32 / 40; image-rendering: pixelated; background: var(--grass); border-radius: 8px; }
  figcaption { font-size: 13px; }
  .map canvas { width: 240px; height: 144px; image-rendering: pixelated; background: var(--grass); border-radius: 8px; display: block; }
  #sheet { width: 100%; max-width: 640px; image-rendering: pixelated; background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 16px 16px; border-radius: 6px; }
  ul#checks { margin: 0; padding-left: 20px; }
  li.ok { color: var(--ok); } li.warn { color: var(--warn); font-weight: 700; }
  label { font-size: 14px; user-select: none; }
  .hidden { display: none; }
  @media (max-width: 560px) { .walk { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<main>
  <h1>도트 시트 미리보기</h1>
  <p class="lead">Aseprite에서 저장한 걷기 시트(160×120)나 큰 그림(128×128)을 아래 칸에 끌어다 놓으세요. 게임과 같은 방식으로 걸어 보여 주고, 칸 규칙을 검사해요. 인터넷이 없어도 돼요.</p>
  <div id="drop" tabindex="0"><b>여기에 PNG를 끌어다 놓거나 눌러서 고르세요</b>boy.png · girl.png · professor.png · *-portrait.png</div>
  <input id="file" type="file" accept="image/png" class="hidden">

  <div id="out" class="hidden">
    <div class="row">
      <div class="card walk" id="walk"></div>
      <div class="card map">
        <canvas id="map" width="160" height="96"></canvas>
        <figcaption>게임 속 크기(지도 한 칸 = 32도트)</figcaption>
        <label><input type="checkbox" id="walking" checked> 걷기</label>
        <label><input type="checkbox" id="big"> 크게</label>
      </div>
    </div>
    <div class="row">
      <div class="card" style="flex:1 1 320px"><b>검사</b><ul id="checks"></ul></div>
      <div class="card" style="flex:1 1 320px"><b>시트 원본</b><br><img id="sheet" alt="불러온 시트"></div>
    </div>
  </div>
</main>
<script>
// 게임과 같은 규칙: 한 칸 32×40 · 5칸(정지, 걷기1~4) × 3줄(아래, 오른쪽, 위) · 발 기준점 (16, 39) · 왼쪽은 오른쪽을 뒤집어요.
const CW = 32, CH = 40, COLS = 5, ROWS = 3, FOOT_Y = 39, STEP_MS = 110, PICTURE = 128; // 게임에서 한 칸(220ms)에 걷기 그림 2장
const DIRS = [['아래', 0, false], ['왼쪽', 1, true], ['오른쪽', 1, false], ['위', 2, false]];
let img = null, data = null;
const $ = s => document.querySelector(s);

function load(file) {
  if (!file) return;
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => { img = im; $('#sheet').src = url; read(); check(file.name); build(); $('#out').classList.remove('hidden'); };
  im.src = url;
}
function read() {
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0); data = g.getImageData(0, 0, c.width, c.height).data;
}
const alpha = (x, y) => data[(y * img.width + x) * 4 + 3];

function check(name) {
  const list = [], ok = (t, good) => list.push([t, good]);
  const isPicture = img.width === PICTURE && img.height === PICTURE;
  if (isPicture) {
    ok(`큰 그림 128×128 — ${name}`, true);
  } else {
    ok(`크기 ${img.width}×${img.height} ${img.width === CW * COLS && img.height === CH * ROWS ? '(맞아요: 160×120)' : '→ 160×120이어야 해요. Aseprite에서 캔버스 크기를 바꾸지 마세요.'}`, img.width === CW * COLS && img.height === CH * ROWS);
  }
  let half = 0; for (let i = 3; i < data.length; i += 4) if (data[i] > 0 && data[i] < 255) half++;
  ok(half ? `반투명 픽셀 ${half}개 → 모두 완전히 불투명하거나 완전히 투명하게(Aseprite 연필, 불투명도 255)` : '반투명 픽셀 없음', !half);
  if (!isPicture && img.width === CW * COLS && img.height === CH * ROWS) {
    const empty = [], floor = [], low = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      let any = false, bottom = -1;
      for (let y = 0; y < CH; y++) for (let x = 0; x < CW; x++) if (alpha(c * CW + x, r * CH + y) > 0) { any = true; bottom = Math.max(bottom, y); }
      const where = `${['아래', '오른쪽', '위'][r]}줄 ${c ? '걷기' + c : '정지'}`;
      if (!any) empty.push(where); else if (bottom >= FOOT_Y) floor.push(where); else if (bottom < FOOT_Y - 2) low.push(`${where}(${FOOT_Y - 1 - bottom}도트 뜸)`);
    }
    ok(empty.length ? `빈 칸: ${empty.join(', ')}` : '15칸 모두 그림이 있어요', !empty.length);
    ok(floor.length ? `맨 아래 빨간 줄(40번째 줄)에 그림이 있어요: ${floor.join(', ')} → 한 줄 위로 올려 주세요` : '맨 아래 줄은 비어 있어요', !floor.length);
    ok(low.length ? `발이 바닥에서 떠 있는 칸: ${low.join(', ')} (점프하는 그림이 아니라면 발끝을 39번째 줄에)` : '모든 칸의 발끝이 바닥 줄에 닿아요', !low.length);
  }
  $('#checks').innerHTML = list.map(([t, good]) => `<li class="${good ? 'ok' : 'warn'}">${good ? '✓' : '!'} ${t}</li>`).join('');
}

function build() {
  const walk = $('#walk'); walk.innerHTML = '';
  if (img.width === PICTURE && img.height === PICTURE) {
    walk.innerHTML = '<figure style="grid-column:1/-1"><canvas id="pic" width="128" height="128" style="max-width:256px;aspect-ratio:1"></canvas><figcaption>큰 그림</figcaption></figure>';
    const g = $('#pic').getContext('2d'); g.drawImage(img, 0, 0); return;
  }
  for (const [label] of DIRS) walk.insertAdjacentHTML('beforeend', `<figure><canvas width="${CW}" height="${CH}"></canvas><figcaption>${label}</figcaption></figure>`);
}

function frame(g, row, col, flip, x, y) {
  g.save(); g.imageSmoothingEnabled = false;
  if (flip) { g.translate(x + CW, y); g.scale(-1, 1); g.drawImage(img, col * CW, row * CH, CW, CH, 0, 0, CW, CH); }
  else g.drawImage(img, col * CW, row * CH, CW, CH, x, y, CW, CH);
  g.restore();
}

function tick(t) {
  requestAnimationFrame(tick);
  if (!img || img.width !== CW * COLS) return;
  const walking = $('#walking').checked, col = walking ? 1 + Math.floor(t / STEP_MS) % 4 : 0;
  document.querySelectorAll('#walk canvas').forEach((c, i) => { const g = c.getContext('2d'); g.clearRect(0, 0, CW, CH); const [, row, flip] = DIRS[i]; frame(g, row, col, flip, 0, 0); });
  // 작은 지도: 풀밭 위에서 오른쪽→아래→왼쪽→위로 한 바퀴 (그림자는 게임처럼 발 밑에)
  const m = $('#map'), g = m.getContext('2d'), big = $('#big').checked;
  m.style.width = big ? '480px' : '240px'; m.style.height = big ? '288px' : '144px';
  g.fillStyle = '#8fc46f'; g.fillRect(0, 0, m.width, m.height);
  g.fillStyle = '#7cb35e'; for (let x = 0; x < m.width; x += 32) for (let y = 0; y < m.height; y += 32) if ((x + y) / 32 % 2) g.fillRect(x, y, 32, 32);
  const loop = walking ? (t / 4000) % 1 : 0, side = Math.floor(loop * 4), k = loop * 4 % 1;
  const path = [[[16, 20], [112, 20], 2], [[112, 20], [112, 52], 0], [[112, 52], [16, 52], 1], [[16, 52], [16, 20], 3]][side];
  const x = path[0][0] + (path[1][0] - path[0][0]) * k, y = path[0][1] + (path[1][1] - path[0][1]) * k, [, row, flip] = DIRS[path[2]];
  g.fillStyle = '#244b5028'; g.fillRect(Math.round(x + 9), Math.round(y + 29), 14, 1);
  frame(g, row, col, flip, Math.round(x), Math.round(y + 30 - FOOT_Y));
}
requestAnimationFrame(tick);

const drop = $('#drop');
drop.onclick = () => $('#file').click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') $('#file').click(); };
$('#file').onchange = e => load(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); load(e.dataTransfer.files[0]); };
</script>
</body>
</html>
